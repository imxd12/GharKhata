<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses Manager – GharKhata</title>
  <meta name="theme-color" content="#065f46">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar"></aside>

    <main class="main-content">
      <header class="app-topbar">
        <div class="topbar-brand">
          <div class="sidebar-brand-icon" style="width:36px; height:36px;">🛒</div>
          <div>
            <h1>Household Expense Ledger</h1>
            <div class="topbar-tagline">Managed exclusively by Mom • Viewable & Reviewable by Dad</div>
          </div>
        </div>
        <div class="topbar-actions"></div>
      </header>

      <!-- Role notice if logged in as Dad -->
      <div id="expense-role-notice"></div>

      <!-- Overview Stats -->
      <section class="stats-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); margin-bottom:24px;">
        <div class="stat-card expense">
          <div class="stat-header">
            <span class="stat-label">Total Household Expenses</span>
            <div class="stat-icon expense">↙</div>
          </div>
          <div class="stat-value text-expense" id="expense-total-amount">₹0</div>
          <div class="stat-footer">
            <span id="expense-total-count">0 entries</span>
            <span class="badge badge-mom">Mom's Ledger</span>
          </div>
        </div>
      </section>

      <!-- Filter & Action Toolbar -->
      <div class="card" style="margin-bottom:20px; padding:16px 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div style="display:flex; gap:12px; flex:1; min-width:280px; flex-wrap:wrap;">
            <input type="text" id="filter-expense-search" class="form-control" placeholder="Search expenses, items or notes..." style="max-width:240px;" />
            <select id="filter-expense-category" class="form-control" style="max-width:180px;">
              <option value="all">All Categories</option>
            </select>
            <select id="filter-expense-mode" class="form-control" style="max-width:160px;">
              <option value="all">All Payment Modes</option>
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
              <option value="Bank">Bank / Card</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <button id="btn-add-expense" class="btn btn-primary">
            <span>+</span> Log Expense & Bill
          </button>
        </div>
      </div>

      <!-- Expense List Container -->
      <div id="expense-list-container">
        <div class="skeleton skeleton-card" style="margin-bottom:10px;"></div>
        <div class="skeleton skeleton-card" style="margin-bottom:10px;"></div>
      </div>
    </main>

    <nav class="mobile-bottom-nav"></nav>
  </div>

  <!-- Add/Edit Expense Modal -->
  <div id="expense-modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="expense-modal-title">Record New Expense</h3>
        <button class="modal-close" onclick="window.GharKhataExpenses.closeModal()">&times;</button>
      </div>
      <form id="expense-modal-form">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Amount (INR) <span class="required">*</span></label>
              <input type="number" id="expense-amount" class="form-control" step="0.01" min="1" placeholder="e.g. 1450" required />
            </div>
            <div class="form-group">
              <label class="form-label">Category <span class="required">*</span></label>
              <select id="expense-category-select" class="form-control" required></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description <span class="required">*</span></label>
            <input type="text" id="expense-description" class="form-control" placeholder="e.g. Weekly vegetable market shopping" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Date <span class="required">*</span></label>
              <input type="date" id="expense-date" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">Payment Mode <span class="required">*</span></label>
              <select id="expense-payment-mode" class="form-control" required>
                <option value="UPI">UPI (GPay, PhonePe, Paytm)</option>
                <option value="Cash">Cash</option>
                <option value="Bank">Bank / Credit Card</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <!-- Attach Receipt / Bill Upload -->
          <div class="form-group">
            <label class="form-label">Receipt / Bill Photo or PDF</label>
            <input type="file" id="expense-receipt-file" class="form-control" accept="image/*,application/pdf" />
            <div id="expense-receipt-preview-box" style="display:none; align-items:center; justify-content:space-between; margin-top:8px; padding:8px 12px; background:var(--bg-subtle); border-radius:var(--radius-md);">
              <div style="display:flex; align-items:center; gap:8px;">
                <img id="expense-receipt-preview-img" src="" alt="Thumbnail" style="width:36px; height:36px; object-fit:cover; border-radius:4px;" />
                <span id="expense-receipt-filename" style="font-size:0.8rem; font-weight:600;"></span>
              </div>
              <button type="button" id="expense-remove-receipt-btn" class="btn btn-outline btn-sm text-expense" style="padding:2px 6px;">Remove</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Optional Notes</label>
            <textarea id="expense-notes" class="form-control" rows="2" placeholder="Item details, invoice number or store name..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="window.GharKhataExpenses.closeModal()">Cancel</button>
          <button type="submit" id="expense-submit-btn" class="btn btn-primary btn-sm">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/discussions.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
