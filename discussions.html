<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remarks & Discussions – GharKhata</title>
  <meta name="theme-color" content="#065f46">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar"></aside>

    <main class="main-content">
      <header class="app-topbar">
        <div class="topbar-brand">
          <div class="sidebar-brand-icon" style="width:36px; height:36px;">💬</div>
          <div>
            <h1>Expense Remarks & Discussions</h1>
            <div class="topbar-tagline">Transparent family dialogue on bills, purchases & clarifications</div>
          </div>
        </div>
        <div class="topbar-actions"></div>
      </header>

      <!-- Explanatory Banner -->
      <div class="card" style="margin-bottom:24px; padding:18px 24px; background:linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-subtle) 100%);">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <h3 style="font-size:1.05rem; font-weight:700; margin-bottom:4px;">How Expense Remarks Work</h3>
            <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">
              Dad can ask questions about any expense from the Expenses or Dashboard pages. Mom receives instant notifications and can reply with clarifications or attach receipt details.
            </p>
          </div>
          <button class="btn btn-whatsapp btn-sm" onclick="window.GharKhataWhatsApp.chatWithPartner()">
            <span>💬 Chat on WhatsApp</span>
          </button>
        </div>
      </div>

      <!-- Discussions Stream Container -->
      <div id="discussions-list-container">
        <div class="skeleton skeleton-card" style="margin-bottom:12px;"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </main>

    <nav class="mobile-bottom-nav"></nav>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/discussions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
